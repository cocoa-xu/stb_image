name: Native safety tests

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  sanitizers:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Run native regression tests with ASan and UBSan
        env:
          CC: clang
        run: python3 test/run_native_tests.py
